services:
  cj-spider:
    image: ${CJ_SPIDER_IMAGE:-cj-spider:phase1}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    ports:
      - "${CJ_SPIDER_BIND_ADDRESS:-127.0.0.1}:${CJ_SPIDER_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the server PostgreSQL URL}
      JWT_SECRET: ${JWT_SECRET:?Set a private random JWT_SECRET}
      # MCP authenticates with per-user API Keys; only upstream login needs env.
      CJ_USERNAME: ${CJ_USERNAME:-}
      CJ_PASSWORD: ${CJ_PASSWORD:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
